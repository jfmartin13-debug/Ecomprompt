<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcomPrompt - Générateur de Prompts E-commerce</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 15px;
      max-width: 650px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .lang-switcher {
      display: flex;
      gap: 4px;
      background: var(--card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    button.btn-generate {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .output-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .btn-copy {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 8px 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>EcomPrompt</h1>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-fr" onclick="setLanguage('fr')">FR</button>
      <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>
  </header>

  <div class="card">
    <label id="lbl-product">Nom du produit / Service</label>
    <input type="text" id="product" placeholder="ex: Gourde isotherme inox 1L">

    <label id="lbl-audience">Public cible</label>
    <input type="text" id="audience" placeholder="ex: Randonneurs et sportifs écoresponsables">

    <label id="lbl-type">Type de contenu</label>
    <select id="type">
      <option value="description" id="opt-desc">Fiche Produit (SEO + Avantages)</option>
      <option value="ad" id="opt-ad">Publicité Facebook / Instagram</option>
      <option value="email" id="opt-email">Courriel de Lancement / Relance</option>
    </select>

    <button class="btn-generate" id="btn-gen" onclick="generatePrompt()">Générer le Prompt</button>
  </div>

  <div class="card" id="result-card" style="display:none;">
    <label id="lbl-result">Votre Prompt IA prêt à copier :</label>
    <div class="output-box" id="output"></div>
    <button class="btn-copy" id="btn-copy" onclick="copyPrompt()">Copier le prompt</button>
  </div>

  <script>
    let currentLang = 'fr';

    const translations = {
      fr: {
        lblProduct: "Nom du produit / Service",
        phProduct: "ex: Gourde isotherme inox 1L",
        lblAudience: "Public cible",
        phAudience: "ex: Randonneurs et sportifs écoresponsables",
        lblType: "Type de contenu",
        optDesc: "Fiche Produit (SEO + Avantages)",
        optAd: "Publicité Facebook / Instagram",
        optEmail: "Courriel de Lancement / Relance",
        btnGen: "Générer le Prompt",
        lblResult: "Votre Prompt IA prêt à copier :",
        btnCopy: "Copier le prompt",
        copied: "Copié !"
      },
      en: {
        lblProduct: "Product / Service Name",
        phProduct: "e.g., 1L Insulated Stainless Steel Water Bottle",
        lblAudience: "Target Audience",
        phAudience: "e.g., Eco-friendly hikers and athletes",
        lblType: "Content Type",
        optDesc: "Product Page (SEO + Benefits)",
        optAd: "Facebook / Instagram Ad",
        optEmail: "Launch / Follow-up Email",
        btnGen: "Generate Prompt",
        lblResult: "Your AI Prompt ready to copy:",
        btnCopy: "Copy prompt",
        copied: "Copied!"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      const t = translations[lang];
      document.getElementById('lbl-product').innerText = t.lblProduct;
      document.getElementById('product').placeholder = t.phProduct;
      document.getElementById('lbl-audience').innerText = t.lblAudience;
      document.getElementById('audience').placeholder = t.phAudience;
      document.getElementById('lbl-type').innerText = t.lblType;
      document.getElementById('opt-desc').innerText = t.optDesc;
      document.getElementById('opt-ad').innerText = t.optAd;
      document.getElementById('opt-email').innerText = t.optEmail;
      document.getElementById('btn-gen').innerText = t.btnGen;
      document.getElementById('lbl-result').innerText = t.lblResult;
      document.getElementById('btn-copy').innerText = t.btnCopy;
    }

    function generatePrompt() {
      const product = document.getElementById('product').value || (currentLang === 'fr' ? 'Mon Produit' : 'My Product');
      const audience = document.getElementById('audience').value || (currentLang === 'fr' ? 'Clients potentiels' : 'Potential Customers');
      const type = document.getElementById('type').value;

      let promptText = "";

      if (currentLang === 'fr') {
        if (type === 'description') {
          promptText = `Rédige une fiche produit captivante et optimisée SEO pour le produit "${product}".\n\n- Public cible : ${audience}\n- Structure : Accroche persuasive, liste des avantages clés avec puces, caractéristiques techniques, et un appel à l'action (CTA) incitatif.\n- Ton : Professionnel, engageant et orienté conversion.`;
        } else if (type === 'ad') {
          promptText = `Rédige 3 variations de textes publicitaires (Facebook/Instagram) pour le produit "${product}".\n\n- Public cible : ${audience}\n- Format : Titre percutant, corps du texte axé sur la résolution de problème, et appel à l'action court.\n- Ton : Captivant, dynamique et persuasif.`;
        } else {
          promptText = `Rédige un courriel de vente pour le produit "${product}".\n\n- Public cible : ${audience}\n- Inclure : 3 propositions d'objets de courriel accrocheurs, un corps de message personnalisé centré sur la valeur du produit, et un bouton d'action clair.\n- Ton : Chaleureux et convaincant.`;
        }
      } else {
        if (type === 'description') {
          promptText = `Write a compelling and SEO-optimized product description for "${product}".\n\n- Target Audience: ${audience}\n- Structure: Strong hook, bulleted list of key benefits, technical details, and a clear Call to Action (CTA).\n- Tone: Professional, engaging, and conversion-focused.`;
        } else if (type === 'ad') {
          promptText = `Write 3 ad copy variations (Facebook/Instagram) for "${product}".\n\n- Target Audience: ${audience}\n- Format: Attention-grabbing headline, problem-solving body copy, and a strong CTA.\n- Tone: Dynamic, persuasive, and engaging.`;
        } else {
          promptText = `Write a sales email for "${product}".\n\n- Target Audience: ${audience}\n- Include: 3 catchy subject line options, personalized body text focusing on value, and a clear call to action.\n- Tone: Warm, convincing, and direct.`;
        }
      }

      document.getElementById('output').innerText = promptText;
      document.getElementById('result-card').style.display = 'block';
    }

    function copyPrompt() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('btn-copy');
        const orig = btn.innerText;
        btn.innerText = translations[currentLang].copied;
        setTimeout(() => btn.innerText = orig, 2000);
      });
    }
  </script>
</body>
</html>
