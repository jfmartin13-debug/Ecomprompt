<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ecomprompt.app - Générateur de Prompts E-commerce</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.5; color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-size: 20px; font-weight: bold; color: #0070f3; margin: 0; }
    .lang-switch { display: flex; gap: 6px; }
    .lang-btn { background: #f0f0f0; border: 1px solid #ccc; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
    .lang-btn.active { background: #0070f3; color: white; border-color: #0070f3; }
    h1 { font-size: 24px; margin-top: 0; }
    p.subtitle { color: #666; font-size: 15px; margin-bottom: 24px; }
    label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; font-size: 14px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button.submit { width: 100%; background: #0070f3; color: white; font-weight: bold; border: none; padding: 14px; margin-top: 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button.submit:active { background: #0051a2; }
    .result { background: #f7f9fa; padding: 16px; border-radius: 6px; border-left: 4px solid #0070f3; margin-top: 24px; }
    .result h3 { margin-top: 0; font-size: 16px; }
    .result p { white-space: pre-wrap; font-size: 14px; color: #222; background: #fff; padding: 12px; border: 1px solid #eee; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">ecomprompt.app</div>
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-fr" onclick="changeLang('fr')">FR</button>
      <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
    </div>
  </div>

  <h1 id="title">Générez vos fiches produits e-commerce en 30 secondes ⚡</h1>
  <p class="subtitle" id="subtitle">Outil 100 % gratuit pour vendeurs Shopify, Amazon et Etsy.</p>

  <label id="label-product">Nom du produit :</label>
  <input type="text" id="input-product" placeholder="Ex: Portefeuille en cuir marron...">

  <label id="label-features">Caractéristiques clés :</label>
  <textarea id="input-features" rows="3" placeholder="Ex: Cuir véritable, fait main, 6 rangements cartes..."></textarea>

  <button class="submit" id="btn-generate" onclick="generatePrompt()">Générer le prompt</button>

  <div class="result" id="result-box" style="display:none;">
    <h3 id="result-title">Votre prompt optimisé :</h3>
    <p id="prompt-output"></p>
  </div>

  <script>
    const texts = {
      fr: {
        title: "Générez vos fiches produits e-commerce en 30 secondes ⚡",
        subtitle: "Outil 100 % gratuit pour vendeurs Shopify, Amazon et Etsy.",
        labelProduct: "Nom du produit :",
        placeholderProduct: "Ex: Portefeuille en cuir marron...",
        labelFeatures: "Caractéristiques clés :",
        placeholderFeatures: "Ex: Cuir véritable, fait main, 6 rangements cartes...",
        btnGenerate: "Générer le prompt",
        resultTitle: "Votre prompt optimisé :"
      },
      en: {
        title: "Generate e-commerce product listings in 30 seconds ⚡",
        subtitle: "100% free tool for Shopify, Amazon, and Etsy sellers.",
        labelProduct: "Product Name:",
        placeholderProduct: "E.g. Brown leather wallet...",
        labelFeatures: "Key Features:",
        placeholderFeatures: "E.g. Genuine leather, handmade, 6 card slots...",
        btnGenerate: "Generate Prompt",
        resultTitle: "Your Optimized Prompt:"
      }
    };

    let currentLang = 'fr';

    function changeLang(lang) {
      currentLang = lang;
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      document.getElementById('title').innerText = texts[lang].title;
      document.getElementById('subtitle').innerText = texts[lang].subtitle;
      document.getElementById('label-product').innerText = texts[lang].labelProduct;
      document.getElementById('input-product').placeholder = texts[lang].placeholderProduct;
      document.getElementById('label-features').innerText = texts[lang].labelFeatures;
      document.getElementById('input-features').placeholder = texts[lang].placeholderFeatures;
      document.getElementById('btn-generate').innerText = texts[lang].btnGenerate;
      document.getElementById('result-title').innerText = texts[lang].resultTitle;
    }

    function generatePrompt() {
      const product = document.getElementById('input-product').value;
      const features = document.getElementById('input-features').value;

      if (!product) return;

      let generated = "";
      if (currentLang === 'fr') {
        generated = `Rédige une fiche produit ultra-convaincante pour le produit suivant : "${product}".\n\nCaractéristiques clés :\n${features}\n\nConsignes :\n- Mets en avant les bénéfices pour le client.\n- Utilise un ton persuasif et engageant adapté au e-commerce.\n- Structure la réponse avec un titre accrocheur, des puces pour les points forts et un appel à l'action.`;
      } else {
        generated = `Write a high-converting product description for the following product: "${product}".\n\nKey features:\n${features}\n\nInstructions:\n- Focus on customer benefits.\n- Use a persuasive and engaging tone optimized for e-commerce.\n- Include an catchy headline, bullet points for key features, and a call-to-action.`;
      }

      document.getElementById('prompt-output').innerText = generated;
      document.getElementById('result-box').style.display = 'block';
    }
  </script>
</body>
</html>
